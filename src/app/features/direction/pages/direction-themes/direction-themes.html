<div class="direction-container">
  <h2 class="font-playfair color-navy">Validation des Themes</h2>
  <p class="text-ink3">Consultez et validez les sujets de memoire soumis par les etudiants.</p>

  <div class="table-responsive card-white">
    <table class="custom-table">
      <thead>
        <tr>
          <th>Etudiant</th>
          <th>Theme propose</th>
          <th>Domaine</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (theme of themesEnAttente(); track theme.id) {
          <tr>
            <td><strong>{{ theme.etudiant_nom }}</strong></td>
            <td>{{ theme.titre }}</td>
            <td><span class="badge-info">{{ theme.domaine }}</span></td>
            <td class="actions">
              <button class="btn-success" (click)="valider(theme.id!)">Valider</button>
              <button class="btn-warn" (click)="demanderCorrection(theme.id!)">Corriger</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="empty-msg">Aucun theme en attente de validation.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
